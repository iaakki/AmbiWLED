name: Docker publish

# Runs the real test suite (no TV or controller needed - both are faked;
# tests/test_ui.py's browser tests self-skip here, since this runner has no
# Firefox - see CLAUDE.md), then only builds and pushes to Docker Hub if
# that passes. Tag pushes (v1.2.3) publish that version plus `latest`;
# workflow_dispatch lets a version already tagged be republished without
# needing a new tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            echo "tags=iaakki/ambiwled:${version},iaakki/ambiwled:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=iaakki/ambiwled:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
