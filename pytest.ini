[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    # paho finalises its socket after the test event loop has closed, which
    # surfaces as an unraisable RuntimeError during garbage collection. It is a
    # teardown artefact of the client library, not of anything under test, and
    # it buries the run summary.
    ignore::pytest.PytestUnraisableExceptionWarning
